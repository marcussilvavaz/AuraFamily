name: Android Build & GitHub Release OTA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build Omni APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Restore app/google-services.json from GitHub Secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -f "app/google-services.json" ] && [ -s "app/google-services.json" ]; then
            echo "app/google-services.json already present in workspace."
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "Restoring app/google-services.json from GOOGLE_SERVICES_JSON secret..."
            FIRST_CHAR=$(printf '%s' "$GOOGLE_SERVICES_JSON" | sed -e 's/^[[:space:]]*//' | cut -c1)
            if [ "$FIRST_CHAR" = "{" ]; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '\r\n ' | base64 --decode > app/google-services.json
            fi
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Restoring app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret..."
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n ' | base64 --decode > app/google-services.json
          else
            echo "::error::O arquivo app/google-services.json não foi encontrado e os secrets GOOGLE_SERVICES_JSON / GOOGLE_SERVICES_JSON_BASE64 não estão configurados no GitHub. Vá em Settings -> Secrets and variables -> Actions -> New repository secret e crie GOOGLE_SERVICES_JSON com o conteúdo do seu google-services.json."
            exit 1
          fi

          if [ ! -s "app/google-services.json" ]; then
            echo "::error::Falha ao restaurar app/google-services.json (arquivo vazio ou inválido)."
            exit 1
          fi

          # Garantir também o arquivo de configuração do banco nomeado do Firestore
          if [ ! -f "app/src/main/res/values/firebase_applet_config.xml" ]; then
            mkdir -p app/src/main/res/values
            cat << 'EOF' > app/src/main/res/values/firebase_applet_config.xml
          <?xml version="1.0" encoding="utf-8" standalone="no"?>
          <resources>
              <string name="firestore_database_id" translatable="false">ai-studio-android-aurafina-1f004ec6-1a1b-4707-ac76-fff9727493c9</string>
          </resources>
          EOF
          fi

      - name: Ensure debug.keystore is available for Android signing validation
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -s "debug.keystore" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            tr -d '\r\n ' < debug.keystore.base64 | base64 --decode > debug.keystore || true
          fi

          if ! keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
            echo "Generating standard Android debug.keystore for CI build..."
            rm -f debug.keystore
            keytool -genkeypair -v \
              -keystore "${GITHUB_WORKSPACE}/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh "${GITHUB_WORKSPACE}/debug.keystore"

      - name: Extract versionCode and versionName from app/build.gradle.kts
        id: extract_version
        run: |
          VERSION_CODE=$(grep -E 'versionCode\s*=\s*[0-9]+' app/build.gradle.kts | head -n 1 | sed -E 's/.*=\s*([0-9]+).*/\1/')
          VERSION_NAME=$(grep -E 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE="12"; fi
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="1.12.0"; fi
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "Extracted VERSION_CODE=${VERSION_CODE}, VERSION_NAME=${VERSION_NAME}"

      - name: Build Omni APK (Signed Release or Debug Fallback)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          GRADLE_CMD="./gradlew"
          if [ ! -f "./gradlew" ]; then
            GRADLE_CMD="gradle"
          fi

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Signing secrets detected. Decoding release keystore..."
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "${GITHUB_WORKSPACE}/my-upload-key.jks"
            export KEYSTORE_PATH="${GITHUB_WORKSPACE}/my-upload-key.jks"
            export KEYSTORE_FILE="${GITHUB_WORKSPACE}/my-upload-key.jks"
            export STORE_PASSWORD="${KEYSTORE_PASSWORD}"
            export KEY_PASSWORD="${KEY_PASSWORD}"

            if [ "$KEY_ALIAS" != "upload" ]; then
              keytool -changealias \
                -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" \
                -storepass "${KEYSTORE_PASSWORD}" \
                -alias "${KEY_ALIAS}" \
                -destalias "upload" \
                -keypass "${KEY_PASSWORD}" >/dev/null 2>&1 || true
            fi

            $GRADLE_CMD assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="${GITHUB_WORKSPACE}/my-upload-key.jks" \
              -Pandroid.injected.signing.store.password="${KEYSTORE_PASSWORD}" \
              -Pandroid.injected.signing.key.alias="upload" \
              -Pandroid.injected.signing.key.password="${KEY_PASSWORD}"
            APK_SOURCE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          else
            echo "No release keystore secrets configured; building installable Debug APK..."
            $GRADLE_CMD assembleDebug --no-daemon
            APK_SOURCE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_SOURCE" ] || [ ! -f "$APK_SOURCE" ]; then
            echo "::error::Built APK not found!"
            exit 1
          fi

          cp "$APK_SOURCE" "${GITHUB_WORKSPACE}/Omni.apk"
          ls -lh "${GITHUB_WORKSPACE}/Omni.apk"

      - name: Upload Omni.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Omni-v${{ env.VERSION_NAME }}-b${{ env.VERSION_CODE }}
          path: ${{ github.workspace }}/Omni.apk

      - name: Publish GitHub Release (OTA)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION_NAME }}"
          name: "Omni v${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})"
          body: |
            VERSION_CODE:${{ env.VERSION_CODE }}
            Atualização oficial OTA do aplicativo Omni (v${{ env.VERSION_NAME }}).
          files: ${{ github.workspace }}/Omni.apk
          make_latest: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
