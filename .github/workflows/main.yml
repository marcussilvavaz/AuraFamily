name: Android Build & GitHub Release OTA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build Omni APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Restore app/google-services.json from GitHub Secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          python3 - << 'PYEOF'
          import base64
          import json
          import os
          import pathlib
          import sys

          target_path = pathlib.Path("app/google-services.json")
          target_path.parent.mkdir(parents=True, exist_ok=True)

          def try_parse_json(text: str):
              cleaned = text.lstrip("\ufeff").strip()
              if not cleaned:
                  return None
              try:
                  data = json.loads(cleaned)
                  if isinstance(data, dict):
                      return data
              except Exception:
                  pass
              # Fallback: extract from first '{' to last '}' in case of extra wrapper characters
              start = cleaned.find("{")
              end = cleaned.rfind("}")
              if start != -1 and end != -1 and end > start:
                  try:
                      data = json.loads(cleaned[start:end + 1])
                      if isinstance(data, dict):
                          return data
                  except Exception:
                      pass
              return None

          def try_decode_base64_json(text: str):
              cleaned = "".join(text.lstrip("\ufeff").split())
              if not cleaned:
                  return None
              padding = (-len(cleaned)) % 4
              if padding:
                  cleaned += "=" * padding
              try:
                  raw_bytes = base64.b64decode(cleaned, validate=False)
                  decoded_str = raw_bytes.decode("utf-8", errors="replace")
                  return try_parse_json(decoded_str)
              except Exception:
                  return None

          parsed_data = None
          if target_path.exists() and target_path.stat().st_size > 0:
              existing = try_parse_json(target_path.read_text(encoding="utf-8", errors="replace"))
              if existing and "project_info" in existing:
                  print("app/google-services.json already present and valid in workspace.")
                  parsed_data = existing

          if parsed_data is None:
              raw_secret = os.environ.get("GOOGLE_SERVICES_JSON", "")
              b64_secret = os.environ.get("GOOGLE_SERVICES_JSON_BASE64", "")

              for label, candidate in [("GOOGLE_SERVICES_JSON", raw_secret), ("GOOGLE_SERVICES_JSON_BASE64", b64_secret)]:
                  if not candidate or not candidate.strip():
                      continue
                  print(f"Restoring app/google-services.json from {label} secret...")
                  # 1. Check raw JSON first
                  data = try_parse_json(candidate)
                  # 2. Only try Base64 if not raw JSON
                  if data is None:
                      data = try_decode_base64_json(candidate)
                  if data is not None and "project_info" in data:
                      parsed_data = data
                      break

          if parsed_data is None or "project_info" not in parsed_data:
              print(
                  "::error::Não foi possível restaurar um app/google-services.json válido (contendo 'project_info'). "
                  "Verifique o secret GOOGLE_SERVICES_JSON em Settings -> Secrets and variables -> Actions.",
                  file=sys.stderr,
              )
              sys.exit(1)

          target_path.write_text(json.dumps(parsed_data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(f"Successfully wrote app/google-services.json ({target_path.stat().st_size} bytes).")

          # Ensure named Firestore database config file exists
          xml_path = pathlib.Path("app/src/main/res/values/firebase_applet_config.xml")
          if not xml_path.exists() or xml_path.stat().st_size == 0:
              xml_path.parent.mkdir(parents=True, exist_ok=True)
              xml_path.write_text(
                  '<?xml version="1.0" encoding="utf-8" standalone="no"?>\n'
                  '<resources>\n'
                  '    <string name="firestore_database_id" translatable="false">'
                  'ai-studio-android-aurafina-1f004ec6-1a1b-4707-ac76-fff9727493c9'
                  '</string>\n'
                  '</resources>\n',
                  encoding="utf-8",
              )
              print("Restored app/src/main/res/values/firebase_applet_config.xml.")
          PYEOF

      - name: Ensure debug.keystore is available for Android signing validation
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -s "debug.keystore" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            python3 -c '
          import base64, pathlib
          raw = "".join(pathlib.Path("debug.keystore.base64").read_text(errors="ignore").split())
          pad = (-len(raw)) % 4
          if pad: raw += "=" * pad
          pathlib.Path("debug.keystore").write_bytes(base64.b64decode(raw))
          ' || true
          fi

          if ! keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
            echo "Generating standard Android debug.keystore for CI build..."
            rm -f debug.keystore
            keytool -genkeypair -v \
              -keystore "${GITHUB_WORKSPACE}/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh "${GITHUB_WORKSPACE}/debug.keystore"

      - name: Extract versionCode and versionName from app/build.gradle.kts
        id: extract_version
        run: |
          VERSION_CODE=$(grep -E 'versionCode\s*=\s*[0-9]+' app/build.gradle.kts | head -n 1 | sed -E 's/.*=\s*([0-9]+).*/\1/')
          VERSION_NAME=$(grep -E 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE="12"; fi
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="1.12.0"; fi
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "Extracted VERSION_CODE=${VERSION_CODE}, VERSION_NAME=${VERSION_NAME}"

      - name: Build Omni APK (Signed Release or Debug Fallback)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          GRADLE_CMD="./gradlew"
          if [ ! -f "./gradlew" ]; then
            GRADLE_CMD="gradle"
          fi

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Signing secrets detected. Decoding release keystore..."
            python3 -c '
          import base64, os, pathlib
          raw = "".join(os.environ["KEYSTORE_BASE64"].split())
          pad = (-len(raw)) % 4
          if pad: raw += "=" * pad
          out = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "my-upload-key.jks"
          out.write_bytes(base64.b64decode(raw))
          '
            export KEYSTORE_PATH="${GITHUB_WORKSPACE}/my-upload-key.jks"
            export KEYSTORE_FILE="${GITHUB_WORKSPACE}/my-upload-key.jks"
            export STORE_PASSWORD="${KEYSTORE_PASSWORD}"
            export KEY_PASSWORD="${KEY_PASSWORD}"

            if [ "$KEY_ALIAS" != "upload" ]; then
              keytool -changealias \
                -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" \
                -storepass "${KEYSTORE_PASSWORD}" \
                -alias "${KEY_ALIAS}" \
                -destalias "upload" \
                -keypass "${KEY_PASSWORD}" >/dev/null 2>&1 || true
            fi

            $GRADLE_CMD assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="${GITHUB_WORKSPACE}/my-upload-key.jks" \
              -Pandroid.injected.signing.store.password="${KEYSTORE_PASSWORD}" \
              -Pandroid.injected.signing.key.alias="upload" \
              -Pandroid.injected.signing.key.password="${KEY_PASSWORD}"
            APK_SOURCE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          else
            echo "No release keystore secrets configured; building installable Debug APK..."
            $GRADLE_CMD assembleDebug --no-daemon
            APK_SOURCE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_SOURCE" ] || [ ! -f "$APK_SOURCE" ]; then
            echo "::error::Built APK not found!"
            exit 1
          fi

          cp "$APK_SOURCE" "${GITHUB_WORKSPACE}/Omni.apk"
          ls -lh "${GITHUB_WORKSPACE}/Omni.apk"

      - name: Upload Omni.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Omni-v${{ env.VERSION_NAME }}-b${{ env.VERSION_CODE }}
          path: ${{ github.workspace }}/Omni.apk

      - name: Publish GitHub Release (OTA)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION_NAME }}"
          name: "Omni v${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})"
          body: |
            VERSION_CODE:${{ env.VERSION_CODE }}
            Atualização oficial OTA do aplicativo Omni (v${{ env.VERSION_NAME }}).
          files: ${{ github.workspace }}/Omni.apk
          make_latest: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
